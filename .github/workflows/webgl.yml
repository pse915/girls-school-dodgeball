name: webgl
on:
  push:
    branches: [main]
    paths:
      - "build/WebGL/**"
      - ".github/workflows/webgl.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check build output
        run: |
          ls -la build/WebGL
          test -f build/WebGL/index.html || (echo "build/WebGL/index.html 없음. Unity에서 WebGL 빌드 후 push 하세요." && exit 1)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL
      - uses: actions/deploy-pages@v4
